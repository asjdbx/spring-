name: Deploy Vue to GitHub Pages
on:
  push:
    branches: [ 博客系统 ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # 稳定 LTS 版本，避免兼容性问题
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 打包项目
        run: npm run build

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist