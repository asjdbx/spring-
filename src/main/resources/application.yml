spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

mybatis:
  configuration:
   map-underscore-to-camel-case: true  #开启驼峰命和下划线命名转换

